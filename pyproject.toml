[project]
name = "latent-gap"
version = "0.1.0"
description = "Do far points in embedding space decode to new ideas? Steam, arXiv and patents."
readme = "README.md"
authors = [
    { name = "Javier Aguilar" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "onnxruntime==1.23.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
